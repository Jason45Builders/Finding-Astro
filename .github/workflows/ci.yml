name: CI

on:
  push:
    branches: [main, master, feature/finding-astro-library]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - id: dependencies
        run: npm ci
      - id: lint
        run: npm run lint:library
      - id: typecheck
        run: npm run typecheck
      - id: test
        run: npm run test
      - name: Production build
        if: always() && steps.dependencies.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        run: npm run build
