name: CI

on:
  push:
    branches: [main, master, feature/finding-astro-library]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:library
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
